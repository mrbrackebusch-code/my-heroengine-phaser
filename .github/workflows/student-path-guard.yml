name: student-path-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Enforce student path guard
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const core = require('@actions/core');

            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No PR context.');
              return;
            }

            const labels = pr.labels.map((l) => l.name);
            if (labels.includes('maintainer-ok')) {
              core.info('Bypass label present.');
              return;
            }

            const repoOwner = context.repo.owner;
            const author = pr.user.login;
            if (author === repoOwner) {
              core.info('Repo owner bypass.');
              return;
            }

            let config = { maintainers: [], owners: {} };
            const configPath = path.join(process.env.GITHUB_WORKSPACE, '.github/student-owners.json');
            if (fs.existsSync(configPath)) {
              try {
                config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
              } catch (err) {
                core.setFailed('Invalid .github/student-owners.json: ' + err.message);
                return;
              }
            }

            if (Array.isArray(config.maintainers) && config.maintainers.includes(author)) {
              core.info('Maintainer bypass.');
              return;
            }

            const ownerFolder = config.owners && config.owners[author];
            const allowedPrefix = ownerFolder ? `src/student/${ownerFolder}/` : 'src/student/';

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const disallowed = files
              .map((f) => f.filename)
              .filter((name) => !name.startsWith(allowedPrefix));

            if (disallowed.length) {
              core.setFailed(`This PR includes files outside ${allowedPrefix}:\n` + disallowed.join('\n'));
            } else {
              core.info(`All files within ${allowedPrefix}`);
            }
