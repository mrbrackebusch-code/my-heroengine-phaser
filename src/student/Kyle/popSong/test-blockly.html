<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PopSong Blockly Test</title>
  <script src="https://cdn.jsdelivr.net/npm/blockly@12.3.1/blockly_compressed.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/blockly@12.3.1/en.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
    .test-container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #4ec9b0; margin-bottom: 20px; }
    .test-section { background: #252526; padding: 16px; margin: 16px 0; border-radius: 4px; border-left: 4px solid #007acc; }
    .test-section h2 { color: #9cdcfe; margin-bottom: 12px; font-size: 16px; }
    .status-pass { color: #4ec9b0; }
    .status-fail { color: #f48771; }
    .status-info { color: #9cdcfe; }
    code { background: #1e1e1e; padding: 2px 6px; border-radius: 2px; }
    pre { background: #1e1e1e; padding: 12px; border-radius: 4px; overflow-x: auto; margin-top: 8px; }
    button { padding: 8px 16px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #005a9e; }
    #testOutput { margin-top: 12px; padding: 12px; background: #1e1e1e; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>🎵 PopSong System Test Suite</h1>
    
    <div class="test-section">
      <h2>Test 1: Block Registration</h2>
      <p>Checking if all PopSong blocks are registered...</p>
      <button onclick="testBlockRegistration()">Run Test 1</button>
      <div id="test1Output"></div>
    </div>

    <div class="test-section">
      <h2>Test 2: SongSpec Compilation</h2>
      <p>Verify workspace to JSON compilation...</p>
      <button onclick="testSongSpecCompilation()">Run Test 2</button>
      <div id="test2Output"></div>
    </div>

    <div class="test-section">
      <h2>Test 3: Live Editor</h2>
      <p>Open the full Blockly editor to manually test block creation and compilation:</p>
      <button onclick="window.open('editor.html', '_blank')">Open Editor →</button>
    </div>

    <div class="test-section">
      <h2>Test Results</h2>
      <div id="testOutput"></div>
    </div>
  </div>

  <script>
    // Initialize Blockly blocks (same as editor.html)
    function initBlocklyBlocks() {
      Blockly.Blocks['popsong_set_tempo'] = {
        init() {
          this.appendDummyInput()
            .appendField('Set Tempo')
            .appendField(new Blockly.FieldNumber(120, 60, 200, 1), 'BPM')
            .appendField('BPM');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(0);
          this.setTooltip('Set song tempo in beats per minute');
        },
      };

      Blockly.Blocks['popsong_set_key'] = {
        init() {
          const keys = [['C', 'C'], ['D', 'D'], ['E', 'E'], ['F', 'F'], ['G', 'G'], ['A', 'A'], ['B', 'B']];
          this.appendDummyInput()
            .appendField('Set Key')
            .appendField(new Blockly.FieldDropdown(keys), 'KEY');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(0);
          this.setTooltip('Set the key of the song');
        },
      };

      Blockly.Blocks['popsong_set_scale'] = {
        init() {
          const scales = [['Major', 'major'], ['Minor', 'minor']];
          this.appendDummyInput()
            .appendField('Set Scale')
            .appendField(new Blockly.FieldDropdown(scales), 'SCALE');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(0);
          this.setTooltip('Set major or minor scale');
        },
      };

      Blockly.Blocks['popsong_song_structure'] = {
        init() {
          this.appendDummyInput()
            .appendField('Song Structure:')
            .appendField(new Blockly.FieldTextInput('VERSE,CHORUS'), 'STRUCTURE');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(120);
          this.setTooltip('Define the order of sections (e.g., VERSE,CHORUS)');
        },
      };

      Blockly.Blocks['popsong_define_section'] = {
        init() {
          this.appendDummyInput()
            .appendField('Section:')
            .appendField(new Blockly.FieldTextInput('Verse'), 'NAME')
            .appendField('Measures:')
            .appendField(new Blockly.FieldNumber(4, 1, 32, 1), 'MEASURES');
          this.appendStatementInput('TRACKS').setCheck(null).appendField('Tracks:');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(120);
          this.setTooltip('Define a song section');
        },
      };

      Blockly.Blocks['popsong_chord_progression'] = {
        init() {
          const chords = [['I', 'I'], ['ii', 'ii'], ['iii', 'iii'], ['IV', 'IV'], ['V', 'V'], ['vi', 'vi']];
          this.appendDummyInput()
            .appendField('Chords:')
            .appendField(new Blockly.FieldDropdown(chords), 'CHORD1')
            .appendField(',')
            .appendField(new Blockly.FieldDropdown(chords), 'CHORD2')
            .appendField(',')
            .appendField(new Blockly.FieldDropdown(chords), 'CHORD3')
            .appendField(',')
            .appendField(new Blockly.FieldDropdown(chords), 'CHORD4');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(240);
          this.setTooltip('Define a 4-chord progression');
        },
      };

      Blockly.Blocks['popsong_chord_pattern'] = {
        init() {
          const patterns = [['Hold', 'HOLD'], ['Strum 8th', 'STRUM_8TH'], ['Arp Up', 'ARP_UP_8TH']];
          this.appendDummyInput()
            .appendField('Chord Pattern:')
            .appendField(new Blockly.FieldDropdown(patterns), 'PATTERN');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(240);
          this.setTooltip('Choose how chords are played');
        },
      };

      Blockly.Blocks['popsong_drum_pattern'] = {
        init() {
          const patterns = [['Pop Basic', 'POP_BASIC'], ['Four on Floor', 'FOUR_ON_FLOOR'], ['Half-time', 'HALF_TIME']];
          this.appendDummyInput()
            .appendField('Drums:')
            .appendField(new Blockly.FieldDropdown(patterns), 'PATTERN')
            .appendField('Intensity:')
            .appendField(new Blockly.FieldNumber(1, 1, 3, 1), 'VARIANT');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(180);
          this.setTooltip('Choose a drum pattern and intensity');
        },
      };

      Blockly.Blocks['popsong_melody_motif'] = {
        init() {
          this.appendDummyInput()
            .appendField('Melody:')
            .appendField(new Blockly.FieldTextInput('1,3,5,3'), 'MOTIF');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(60);
          this.setTooltip('Scale degrees 1–7');
        },
      };

      Blockly.Blocks['popsong_melody_durations'] = {
        init() {
          this.appendDummyInput()
            .appendField('Note Lengths:')
            .appendField(new Blockly.FieldTextInput('4n,4n,4n,4n'), 'DURS');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(60);
          this.setTooltip('4n=quarter, 8n=eighth, 16n=sixteenth');
        },
      };

      Blockly.Blocks['popsong_melody_mode'] = {
        init() {
          const modes = [['Scale', 'SCALE'], ['Chord Tones', 'CHORD_TONES']];
          this.appendDummyInput()
            .appendField('Melody Mode:')
            .appendField(new Blockly.FieldDropdown(modes), 'MODE');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(60);
          this.setTooltip('How melody notes snap to chords');
        },
      };
    }

    function testBlockRegistration() {
      const output = document.getElementById('test1Output');
      try {
        initBlocklyBlocks();
        
        const blockTypes = [
          'popsong_set_tempo',
          'popsong_set_key',
          'popsong_set_scale',
          'popsong_song_structure',
          'popsong_define_section',
          'popsong_chord_progression',
          'popsong_chord_pattern',
          'popsong_drum_pattern',
          'popsong_melody_motif',
          'popsong_melody_durations',
          'popsong_melody_mode'
        ];

        let allFound = true;
        let results = '';
        
        for (const type of blockTypes) {
          if (Blockly.Blocks[type]) {
            results += `<div class="status-pass">✓ ${type}</div>`;
          } else {
            results += `<div class="status-fail">✗ ${type} NOT FOUND</div>`;
            allFound = false;
          }
        }

        output.innerHTML = results;
        if (allFound) {
          output.innerHTML += `<div class="status-pass"><strong>✓ All ${blockTypes.length} blocks registered successfully!</strong></div>`;
        }
      } catch (e) {
        output.innerHTML = `<div class="status-fail">Error: ${e.message}</div>`;
      }
    }

    function testSongSpecCompilation() {
      const output = document.getElementById('test2Output');
      try {
        initBlocklyBlocks();

        // Create a test workspace
        const testWorkspace = new Blockly.Workspace();

        // Create blocks
        const tempoBlock = testWorkspace.newBlock('popsong_set_tempo');
        tempoBlock.setFieldValue('140', 'BPM');

        const keyBlock = testWorkspace.newBlock('popsong_set_key');
        keyBlock.setFieldValue('G', 'KEY');

        const scaleBlock = testWorkspace.newBlock('popsong_set_scale');
        scaleBlock.setFieldValue('major', 'SCALE');

        const structBlock = testWorkspace.newBlock('popsong_song_structure');
        structBlock.setFieldValue('VERSE,CHORUS,VERSE,CHORUS', 'STRUCTURE');

        // Compile
        const spec = compileBlocklyToSongSpec(testWorkspace);

        output.innerHTML = `
          <div class="status-pass">✓ Compilation successful!</div>
          <pre>${JSON.stringify(spec, null, 2)}</pre>
        `;
      } catch (e) {
        output.innerHTML = `<div class="status-fail">Error: ${e.message}</div><pre>${e.stack}</pre>`;
      }
    }

    function compileBlocklyToSongSpec(workspace) {
      let spec = {
        tempo: 120,
        key: 'C',
        scale: 'major',
        structure: ['VERSE'],
        sections: {},
      };

      const topBlocks = workspace.getTopBlocks();
      
      for (const block of topBlocks) {
        const type = block.type;

        if (type === 'popsong_set_tempo') {
          spec.tempo = parseInt(block.getFieldValue('BPM'));
        } else if (type === 'popsong_set_key') {
          spec.key = block.getFieldValue('KEY');
        } else if (type === 'popsong_set_scale') {
          spec.scale = block.getFieldValue('SCALE');
        } else if (type === 'popsong_song_structure') {
          const structStr = block.getFieldValue('STRUCTURE');
          spec.structure = structStr.split(',').map((s) => s.trim());
        }
      }

      if (!spec.sections[spec.structure[0]]) {
        spec.sections['VERSE'] = {
          measures: 4,
          chords: { prog: ['I', 'V', 'vi', 'IV'], pattern: 'HOLD' },
          drums: { pattern: 'POP_BASIC', variant: 1 },
          melody: { motif: [1, 3, 5, 3], dur: ['4n', '4n', '4n', '4n'], mode: 'SCALE' },
        };
      }

      return spec;
    }

    // Run tests on page load
    window.addEventListener('load', () => {
      document.getElementById('testOutput').innerHTML = `
        <div class="status-info">Ready! Click the buttons above to run tests, or open the full editor.</div>
      `;
    });
  </script>
</body>
</html>
