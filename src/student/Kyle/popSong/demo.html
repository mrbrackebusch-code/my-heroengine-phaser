<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PopSong Demo (Kyle)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; background:#111; color:#eee; display:flex; align-items:center; justify-content:center; height:100vh; margin:0 }
    .card { padding:24px; border-radius:8px; background:#222; box-shadow:0 6px 18px rgba(0,0,0,0.6); }
    button { font-size:16px; padding:10px 16px; margin:6px; }
    #status { margin-top:12px; font-size:13px; color:#9f9; }
  </style>
</head>
<body>
  <div class="card">
    <h2>PopSong Demo (Kyle)</h2>
    <p>Click <strong>Start Audio</strong> once, then use Play / Pause / Stop.</p>
    <button id="start">Start Audio & Play Example</button>
    <button id="pause">Pause</button>
    <button id="stop">Stop</button>
    <div id="status">Idle</div>

    <script type="module">
      const status = document.getElementById('status');
      const startBtn = document.getElementById('start');
      const pauseBtn = document.getElementById('pause');
      const stopBtn = document.getElementById('stop');

      startBtn.addEventListener('click', async () => {
        status.textContent = 'Loading module...';
        try {
          const mod = await import('/src/student/Kyle/popSong/index.ts');
          status.textContent = 'Initializing audio... (user gesture)';
          await mod.initAndPlayExample();
          status.textContent = 'Playing example song';
        } catch (e) {
          console.error(e);
          status.textContent = 'Error: see console';
        }
      });

      pauseBtn.addEventListener('click', async () => {
        const mod = await import('/src/student/Kyle/popSong/index.ts');
        mod.engine.pause?.();
        status.textContent = 'Paused';
      });

      stopBtn.addEventListener('click', async () => {
        const mod = await import('/src/student/Kyle/popSong/index.ts');
        mod.engine.stop?.();
        status.textContent = 'Stopped';
      });
    </script>
  </div>
</body>
</html>
