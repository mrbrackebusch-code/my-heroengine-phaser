<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PopSong Sound Design Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
    }
    h1 { color: #333; margin-bottom: 8px; font-size: 28px; }
    p { color: #666; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
    .controls { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    button {
      flex: 1;
      min-width: 100px;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-play { background: #4CAF50; color: white; }
    .btn-play:hover:not(:disabled) { background: #45a049; transform: translateY(-2px); }
    .btn-pause { background: #FF9800; color: white; }
    .btn-pause:hover:not(:disabled) { background: #e68900; transform: translateY(-2px); }
    .btn-stop { background: #f44336; color: white; }
    .btn-stop:hover:not(:disabled) { background: #da190b; transform: translateY(-2px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      padding: 16px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 13px;
      color: #333;
      font-family: 'Courier New', monospace;
      min-height: 80px;
      line-height: 1.5;
      max-height: 200px;
      overflow-y: auto;
    }
    .error { color: #d32f2f; font-weight: 600; }
    .success { color: #388e3c; font-weight: 600; }
    .info { color: #1976d2; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 PopSong Sound Design Test</h1>
    <p>Testing the improved Tone.js sound design with real instruments (lead synth, chord pad, bass, drums).</p>
    
    <div class="controls">
      <button class="btn-play" id="playBtn" onclick="playExample()">▶ Play</button>
      <button class="btn-pause" id="pauseBtn" onclick="pausePlayback()" disabled>⏸ Pause</button>
      <button class="btn-stop" id="stopBtn" onclick="stopPlayback()" disabled>⏹ Stop</button>
    </div>

    <div id="status">Ready. Click Play to begin.</div>
  </div>

  <script type="module">
    import { MusicEngine } from './MusicEngine.js';
    import { exampleSong } from './exampleSong.js';

    let engine = null;
    let isPlaying = false;

    window.playExample = async () => {
      log('🔄 Initializing...', 'info');
      try {
        if (!engine) {
          engine = new MusicEngine();
        }
        await engine.initAudioOnce();
        log('✓ Audio context started', 'success');
        
        await engine.loadSong(exampleSong);
        log('✓ Song loaded (C major, Pop Basic drums)', 'success');
        
        engine.play();
        isPlaying = true;
        updateButtons();
        log('▶ Playing... Listen for: kick, snare, hi-hat, chords, and melody', 'success');
      } catch (e) {
        log('❌ Error: ' + (e?.message || String(e)), 'error');
        console.error(e);
      }
    };

    window.pausePlayback = () => {
      if (engine && isPlaying) {
        engine.pause();
        isPlaying = false;
        updateButtons();
        log('⏸ Paused', 'info');
      }
    };

    window.stopPlayback = () => {
      if (engine) {
        engine.stop();
        isPlaying = false;
        engine = null;
        updateButtons();
        log('⏹ Stopped. Instruments cleaned up.', 'info');
      }
    };

    function updateButtons() {
      document.getElementById('playBtn').disabled = isPlaying;
      document.getElementById('pauseBtn').disabled = !isPlaying;
      document.getElementById('stopBtn').disabled = !isPlaying;
    }

    function log(msg, type = '') {
      const status = document.getElementById('status');
      const time = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = type;
      line.textContent = `[${time}] ${msg}`;
      status.insertBefore(line, status.firstChild);
      
      // Keep only last 8 lines
      while (status.children.length > 8) {
        status.removeChild(status.lastChild);
      }
    }

    log('✓ PopSong module loaded. Ready to test.', 'success');
    updateButtons();
  </script>
</body>
</html>
