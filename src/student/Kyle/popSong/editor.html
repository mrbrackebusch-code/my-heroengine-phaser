<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PopSong Blockly Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/blockly@12.3.1/blockly_compressed.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/blockly@12.3.1/en.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
    .container { display: flex; height: 100vh; }
    .editor-pane { flex: 1; display: flex; flex-direction: column; }
    .control-bar { background: white; padding: 12px 16px; border-bottom: 1px solid #ddd; display: flex; gap: 8px; align-items: center; }
    #blockly { flex: 1; }
    .output-pane { width: 350px; background: white; border-left: 1px solid #ddd; padding: 16px; overflow-y: auto; }
    .output-pane h3 { margin-bottom: 12px; color: #333; }
    #output { background: #f9f9f9; padding: 12px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; line-height: 1.4; }
    button { padding: 8px 16px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-play { background: #4CAF50; color: white; }
    .btn-play:hover:not(:disabled) { background: #45a049; }
    .btn-pause { background: #FF9800; color: white; }
    .btn-pause:hover:not(:disabled) { background: #e68900; }
    .btn-stop { background: #f44336; color: white; }
    .btn-stop:hover:not(:disabled) { background: #da190b; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { padding: 8px 12px; background: #e3f2fd; color: #1976d2; border-radius: 4px; font-size: 13px; }
    .error { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <div class="container">
    <div class="editor-pane">
      <div class="control-bar">
        <button class="btn-play" id="playBtn" onclick="playFromBlocks()">▶ Play Song</button>
        <button class="btn-pause" id="pauseBtn" onclick="pausePlayback()" disabled>⏸ Pause</button>
        <button class="btn-stop" id="stopBtn" onclick="stopPlayback()" disabled>⏹ Stop</button>
        <div id="status" class="status">Ready</div>
      </div>
      <div id="blockly"></div>
    </div>

    <div class="output-pane">
      <h3>SongSpec JSON</h3>
      <div id="output">Click blocks to see SongSpec...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tone@15/build/Tone.js"></script>
  <script>
    // Initialize Blockly blocks
    function initBlocklyBlocks() {
      // SETTINGS BLOCKS
      Blockly.Blocks['popsong_set_tempo'] = {
        init() {
          this.appendDummyInput()
            .appendField('Set Tempo')
            .appendField(new Blockly.FieldNumber(120, 60, 200, 1), 'BPM')
            .appendField('BPM');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(0);
          this.setTooltip('Set song tempo in beats per minute');
        },
      };

      Blockly.Blocks['popsong_set_key'] = {
        init() {
          const keys = [['C', 'C'], ['D', 'D'], ['E', 'E'], ['F', 'F'], ['G', 'G'], ['A', 'A'], ['B', 'B']];
          this.appendDummyInput()
            .appendField('Set Key')
            .appendField(new Blockly.FieldDropdown(keys), 'KEY');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(0);
          this.setTooltip('Set the key of the song');
        },
      };

      Blockly.Blocks['popsong_set_scale'] = {
        init() {
          const scales = [['Major', 'major'], ['Minor', 'minor']];
          this.appendDummyInput()
            .appendField('Set Scale')
            .appendField(new Blockly.FieldDropdown(scales), 'SCALE');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(0);
          this.setTooltip('Set major or minor scale');
        },
      };

      // STRUCTURE BLOCKS
      Blockly.Blocks['popsong_song_structure'] = {
        init() {
          this.appendDummyInput()
            .appendField('Song Structure:')
            .appendField(new Blockly.FieldTextInput('VERSE,CHORUS'), 'STRUCTURE');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(120);
          this.setTooltip('Define the order of sections (e.g., VERSE,CHORUS)');
        },
      };

      Blockly.Blocks['popsong_define_section'] = {
        init() {
          this.appendDummyInput()
            .appendField('Section:')
            .appendField(new Blockly.FieldTextInput('Verse'), 'NAME')
            .appendField('Measures:')
            .appendField(new Blockly.FieldNumber(4, 1, 32, 1), 'MEASURES');
          this.appendStatementInput('TRACKS').setCheck(null).appendField('Tracks:');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(120);
          this.setTooltip('Define a song section');
        },
      };

      // CHORD BLOCKS
      Blockly.Blocks['popsong_chord_progression'] = {
        init() {
          const chords = [['I', 'I'], ['ii', 'ii'], ['iii', 'iii'], ['IV', 'IV'], ['V', 'V'], ['vi', 'vi']];
          this.appendDummyInput()
            .appendField('Chords:')
            .appendField(new Blockly.FieldDropdown(chords), 'CHORD1')
            .appendField(',')
            .appendField(new Blockly.FieldDropdown(chords), 'CHORD2')
            .appendField(',')
            .appendField(new Blockly.FieldDropdown(chords), 'CHORD3')
            .appendField(',')
            .appendField(new Blockly.FieldDropdown(chords), 'CHORD4');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(240);
          this.setTooltip('Define a 4-chord progression');
        },
      };

      Blockly.Blocks['popsong_chord_pattern'] = {
        init() {
          const patterns = [['Hold', 'HOLD'], ['Strum 8th', 'STRUM_8TH'], ['Arp Up', 'ARP_UP_8TH']];
          this.appendDummyInput()
            .appendField('Chord Pattern:')
            .appendField(new Blockly.FieldDropdown(patterns), 'PATTERN');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(240);
          this.setTooltip('Choose how chords are played');
        },
      };

      // DRUM BLOCK
      Blockly.Blocks['popsong_drum_pattern'] = {
        init() {
          const patterns = [['Pop Basic', 'POP_BASIC'], ['Four on Floor', 'FOUR_ON_FLOOR'], ['Half-time', 'HALF_TIME']];
          this.appendDummyInput()
            .appendField('Drums:')
            .appendField(new Blockly.FieldDropdown(patterns), 'PATTERN')
            .appendField('Intensity:')
            .appendField(new Blockly.FieldNumber(1, 1, 3, 1), 'VARIANT');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(180);
          this.setTooltip('Choose a drum pattern and intensity');
        },
      };

      // MELODY BLOCKS
      Blockly.Blocks['popsong_melody_motif'] = {
        init() {
          this.appendDummyInput()
            .appendField('Melody:')
            .appendField(new Blockly.FieldTextInput('1,3,5,3'), 'MOTIF');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(60);
          this.setTooltip('Scale degrees 1–7');
        },
      };

      Blockly.Blocks['popsong_melody_durations'] = {
        init() {
          this.appendDummyInput()
            .appendField('Note Lengths:')
            .appendField(new Blockly.FieldTextInput('4n,4n,4n,4n'), 'DURS');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(60);
          this.setTooltip('4n=quarter, 8n=eighth, 16n=sixteenth');
        },
      };

      Blockly.Blocks['popsong_melody_mode'] = {
        init() {
          const modes = [['Scale', 'SCALE'], ['Chord Tones', 'CHORD_TONES']];
          this.appendDummyInput()
            .appendField('Melody Mode:')
            .appendField(new Blockly.FieldDropdown(modes), 'MODE');
          this.setPreviousStatement(true);
          this.setNextStatement(true);
          this.setColour(60);
          this.setTooltip('How melody notes snap to chords');
        },
      };
    }

    // Compile Blockly workspace to SongSpec JSON
    function compileBlocklyToSongSpec(workspace) {
      let spec = {
        tempo: 120,
        key: 'C',
        scale: 'major',
        structure: ['VERSE'],
        sections: {},
      };

      const topBlocks = workspace.getTopBlocks();
      
      for (const block of topBlocks) {
        const type = block.type;

        if (type === 'popsong_set_tempo') {
          spec.tempo = parseInt(block.getFieldValue('BPM'));
        } else if (type === 'popsong_set_key') {
          spec.key = block.getFieldValue('KEY');
        } else if (type === 'popsong_set_scale') {
          spec.scale = block.getFieldValue('SCALE');
        } else if (type === 'popsong_song_structure') {
          const structStr = block.getFieldValue('STRUCTURE');
          spec.structure = structStr.split(',').map((s) => s.trim());
        } else if (type === 'popsong_define_section') {
          const sectionName = block.getFieldValue('NAME');
          const measures = parseInt(block.getFieldValue('MEASURES'));

          const chords = { prog: ['I', 'V', 'vi', 'IV'], pattern: 'HOLD' };
          const drums = { pattern: 'POP_BASIC', variant: 1 };
          const melody = { motif: [1, 3, 5, 3], dur: ['4n', '4n', '4n', '4n'], mode: 'SCALE' };

          const tracksInput = block.getInput('TRACKS');
          if (tracksInput && tracksInput.connection && tracksInput.connection.targetBlock()) {
            let trackBlock = tracksInput.connection.targetBlock();
            while (trackBlock) {
              if (trackBlock.type === 'popsong_chord_progression') {
                const prog = [];
                for (let i = 1; i <= 4; i++) {
                  const c = trackBlock.getFieldValue(`CHORD${i}`);
                  if (c) prog.push(c);
                }
                if (prog.length > 0) chords.prog = prog;
              } else if (trackBlock.type === 'popsong_chord_pattern') {
                chords.pattern = trackBlock.getFieldValue('PATTERN');
              } else if (trackBlock.type === 'popsong_drum_pattern') {
                drums.pattern = trackBlock.getFieldValue('PATTERN');
                drums.variant = parseInt(trackBlock.getFieldValue('VARIANT'));
              } else if (trackBlock.type === 'popsong_melody_motif') {
                const m = trackBlock.getFieldValue('MOTIF').split(',').map((x) => {
                  x = x.trim().toUpperCase();
                  return x === 'R' ? 'R' : parseInt(x);
                });
                melody.motif = m;
              } else if (trackBlock.type === 'popsong_melody_durations') {
                melody.dur = trackBlock.getFieldValue('DURS').split(',').map((d) => d.trim());
              } else if (trackBlock.type === 'popsong_melody_mode') {
                melody.mode = trackBlock.getFieldValue('MODE');
              }
              trackBlock = trackBlock.nextConnection ? trackBlock.nextConnection.targetBlock() : null;
            }
          }

          spec.sections[sectionName] = { measures, chords, drums, melody };
        }
      }

      if (!spec.sections[spec.structure[0]]) {
        spec.sections['VERSE'] = {
          measures: 4,
          chords: { prog: ['I', 'V', 'vi', 'IV'], pattern: 'HOLD' },
          drums: { pattern: 'POP_BASIC', variant: 1 },
          melody: { motif: [1, 3, 5, 3], dur: ['4n', '4n', '4n', '4n'], mode: 'SCALE' },
        };
        spec.structure = ['VERSE'];
      }

      return spec;
    }

    // Setup on page load
    let workspace;
    let isPlaying = false;

    document.addEventListener('DOMContentLoaded', () => {
      // Initialize blocks
      initBlocklyBlocks();

      // Create workspace
      workspace = Blockly.inject('blockly', {
        toolbox: getToolbox(),
        collapse: true,
        comments: true,
        disable: true,
        maxBlocks: Infinity,
        trashcan: true,
        horizontalLayout: false,
        toolboxPosition: 'start',
        rtl: false,
        scrollbars: true,
        sounds: true,
        oneBasedIndex: true,
      });

      // Listen for changes
      workspace.addChangeListener(() => {
        try {
          const spec = compileBlocklyToSongSpec(workspace);
          document.getElementById('output').textContent = JSON.stringify(spec, null, 2);
          document.getElementById('status').textContent = '✓ Valid';
          document.getElementById('status').className = 'status';
        } catch (e) {
          document.getElementById('status').textContent = '✗ Error: ' + e.message;
          document.getElementById('status').className = 'status error';
        }
      });

      // Setup button handlers
      window.playFromBlocks = async () => {
        alert('Play functionality requires backend WebAudio integration. SongSpec compilation is working!');
      };

      window.pausePlayback = () => {
        document.getElementById('status').textContent = '⏸ Paused';
        isPlaying = false;
        updateButtons();
      };

      window.stopPlayback = () => {
        document.getElementById('status').textContent = '⏹ Stopped';
        isPlaying = false;
        updateButtons();
      };

      function updateButtons() {
        document.getElementById('playBtn').disabled = isPlaying;
        document.getElementById('pauseBtn').disabled = !isPlaying;
        document.getElementById('stopBtn').disabled = !isPlaying;
      }

      // Trigger initial state
      workspace.fireChangeListener(new Blockly.Events.Create(null));
    });

    function getToolbox() {
      return {
        kind: 'flyoutToolbox',
        contents: [
          {
            kind: 'category',
            name: 'Settings',
            colour: '#0',
            contents: [
              { kind: 'block', type: 'popsong_set_tempo' },
              { kind: 'block', type: 'popsong_set_key' },
              { kind: 'block', type: 'popsong_set_scale' },
            ],
          },
          {
            kind: 'category',
            name: 'Structure',
            colour: '#78',
            contents: [
              { kind: 'block', type: 'popsong_song_structure' },
              { kind: 'block', type: 'popsong_define_section' },
            ],
          },
          {
            kind: 'category',
            name: 'Chords',
            colour: '#f0',
            contents: [
              { kind: 'block', type: 'popsong_chord_progression' },
              { kind: 'block', type: 'popsong_chord_pattern' },
            ],
          },
          {
            kind: 'category',
            name: 'Drums',
            colour: '#b4',
            contents: [
              { kind: 'block', type: 'popsong_drum_pattern' },
            ],
          },
          {
            kind: 'category',
            name: 'Melody',
            colour: '#3c',
            contents: [
              { kind: 'block', type: 'popsong_melody_motif' },
              { kind: 'block', type: 'popsong_melody_durations' },
              { kind: 'block', type: 'popsong_melody_mode' },
            ],
          },
        ],
      };
    }
  </script>
</body>
</html>
