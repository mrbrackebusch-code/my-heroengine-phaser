<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PopSong Test (Playable)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
    }
    h1 { color: #333; margin-bottom: 8px; font-size: 28px; }
    p { color: #666; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
    .controls { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    button {
      flex: 1;
      min-width: 100px;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-play { background: #4CAF50; color: white; }
    .btn-play:hover { background: #45a049; transform: translateY(-2px); }
    .btn-pause { background: #FF9800; color: white; }
    .btn-pause:hover { background: #e68900; transform: translateY(-2px); }
    .btn-stop { background: #f44336; color: white; }
    .btn-stop:hover { background: #da190b; transform: translateY(-2px); }
    #status {
      padding: 16px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 13px;
      color: #333;
      font-family: 'Courier New', monospace;
      min-height: 60px;
      line-height: 1.5;
    }
    .error { color: #d32f2f; }
    .success { color: #388e3c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 PopSong Test</h1>
    <p>A minimal playable test of the PopSong system with Tone.js. Click Play to start!</p>
    
    <div class="controls">
      <button class="btn-play" onclick="playExample()">▶ Play</button>
      <button class="btn-pause" onclick="pausePlayback()">⏸ Pause</button>
      <button class="btn-stop" onclick="stopPlayback()">⏹ Stop</button>
    </div>

    <div id="status">Ready. Click Play to begin.</div>
  </div>

  <script type="module">
    // Inline PopSong system for testing
    import * as Tone from 'tone';

    // Simple SongSpec
    const exampleSong = {
      tempo: 120,
      key: 'C',
      scale: 'major',
      structure: ['VERSE'],
      sections: {
        VERSE: {
          measures: 4,
          chords: { prog: ['I', 'V', 'vi', 'IV'], pattern: 'STRUM_8TH' },
          drums: { pattern: 'POP_BASIC', variant: 1 },
          melody: { motif: [1, 3, 5, 3], dur: ['4n', '4n', '4n', '4n'], mode: 'CHORD_TONES' },
        },
      },
      instruments: {
        melody: 'SYNTH_LEAD',
        chords: 'SYNTH_PAD',
        drums: 'DRUMKIT_1',
      },
    };

    let started = false;

    // MusicEngine
    class MusicEngine {
      constructor() {
        this.started = false;
      }

      async initAudioOnce() {
        if (!this.started) {
          await Tone.start();
          this.started = true;
          log('✓ Audio initialized', 'success');
        }
      }

      loadSong(spec) {
        this.stop();
        Tone.Transport.cancel();
        Tone.Transport.bpm.value = spec.tempo || 120;
        log('📋 Song loaded: ' + spec.key + ' ' + spec.scale, 'success');

        // Simple instruments
        const melodySynth = new Tone.MonoSynth({
          oscillator: { type: 'sawtooth' },
          envelope: { attack: 0.01, decay: 0.1, sustain: 0.3, release: 0.3 },
        }).toDestination();

        const chordsSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.1, decay: 0.2, sustain: 0.6, release: 0.8 },
        }).toDestination();

        const kick = new Tone.MembraneSynth().toDestination();
        const snare = new Tone.NoiseSynth({
          noise: { type: 'white' },
          envelope: { attack: 0.001, decay: 0.2, sustain: 0 },
        }).toDestination();

        // Simple drum pattern: kick-snare pattern
        const drumPattern = ['K', '.', '.', '.', '.', 'S', '.', '.', 'K', '.', '.', '.', '.', 'S', '.', '.'];
        
        const drumSeq = new Tone.Sequence((time, step) => {
          const hit = drumPattern[Number(step) % drumPattern.length];
          if (hit === 'K') kick.triggerAttackRelease('C1', '8n', time);
          else if (hit === 'S') snare.triggerAttackRelease('8n', time);
        }, drumPattern.map((_, i) => i), '16n');
        drumSeq.start(0);

        // Chords: simple C major
        const chords = [['C3', 'E3', 'G3'], ['G2', 'B2', 'D3'], ['A2', 'C3', 'E3'], ['F2', 'A2', 'C3']];
        
        Tone.Transport.schedule((time) => {
          chordsSynth.triggerAttackRelease(chords[0], '1m', time, 0.7);
        }, '0:0:0');
        Tone.Transport.schedule((time) => {
          chordsSynth.triggerAttackRelease(chords[1], '1m', time, 0.7);
        }, '1:0:0');
        Tone.Transport.schedule((time) => {
          chordsSynth.triggerAttackRelease(chords[2], '1m', time, 0.7);
        }, '2:0:0');
        Tone.Transport.schedule((time) => {
          chordsSynth.triggerAttackRelease(chords[3], '1m', time, 0.7);
        }, '3:0:0');

        // Melody: simple pattern
        const melodyNotes = ['C4', 'E4', 'G4', 'E4'];
        const durs = ['4n', '4n', '4n', '4n'];
        
        melodyNotes.forEach((note, i) => {
          Tone.Transport.schedule((time) => {
            melodySynth.triggerAttackRelease(note, durs[i], time, 0.9);
          }, `0:${i}:0`);
          Tone.Transport.schedule((time) => {
            melodySynth.triggerAttackRelease(note, durs[i], time, 0.9);
          }, `1:${i}:0`);
          Tone.Transport.schedule((time) => {
            melodySynth.triggerAttackRelease(note, durs[i], time, 0.9);
          }, `2:${i}:0`);
          Tone.Transport.schedule((time) => {
            melodySynth.triggerAttackRelease(note, durs[i], time, 0.9);
          }, `3:${i}:0`);
        });

        if (Tone.Transport.state !== 'started') {
          Tone.Transport.start();
        }
      }

      play() {
        if (Tone.Transport.state !== 'started') Tone.Transport.start();
        log('▶ Playing...', 'success');
      }

      pause() {
        if (Tone.Transport.state === 'started') Tone.Transport.pause();
        log('⏸ Paused', 'success');
      }

      stop() {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        log('⏹ Stopped', 'success');
      }
    }

    const engine = new MusicEngine();

    // Global functions
    window.playExample = async () => {
      log('🔄 Starting...', 'success');
      try {
        await engine.initAudioOnce();
        engine.loadSong(exampleSong);
        engine.play();
      } catch (e) {
        log('❌ Error: ' + e.message, 'error');
        console.error(e);
      }
    };

    window.pausePlayback = () => {
      engine.pause();
    };

    window.stopPlayback = () => {
      engine.stop();
    };

    function log(msg, type = '') {
      const status = document.getElementById('status');
      const time = new Date().toLocaleTimeString();
      const line = `[${time}] ${msg}`;
      status.innerHTML = `<div class="${type}">${line}</div>` + status.innerHTML;
      // Keep only last 5 lines
      const lines = status.querySelectorAll('div');
      if (lines.length > 5) {
        lines[lines.length - 1].remove();
      }
    }

    log('✓ Module loaded. Ready.', 'success');
  </script>
</body>
</html>
